name: Build DonghuaArabic extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build CloudStream plugin
        run: |
          # The upstream compatibility task currently crashes on Gradle 8.9
          # after compilePluginJar has already produced the cross-platform JAR.
          gradle --no-daemon make makePluginsJson -x :DonghuaArabicProvider:ensureJarCompatibility
      - name: List generated plugin files
        if: always()
        run: |
          find DonghuaArabicProvider/build build -type f \( -name '*.cs3' -o -name '*.jar' -o -name 'plugins.json' \) -print 2>/dev/null || true
      - name: Upload build outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donghuaarabic-build-output
          path: |
            DonghuaArabicProvider/build/
            build/plugins.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish repository branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p publish
          cp DonghuaArabicProvider/build/*.cs3 publish/
          cp build/plugins.json publish/
          cat > publish/repo.json <<'EOF'
          {
            "name": "DonghuaArabic",
            "description": "Arabic Donghua provider for CSWeb TV",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/achrefdiabi932-prog/DonghuaArabic-CloudStream/builds/plugins.json"
            ]
          }
          EOF
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish DonghuaArabic extension"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:builds
